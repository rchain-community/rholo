name: RC-B current-source red-green verification
on:
  push:
    branches: [verify/n564-order-current-20261111]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin current base and original recovered evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n564-current-logs
          git rev-parse HEAD > n564-current-logs/verification-head.txt
          cp casper/tests/replay_trace_order.rs n564-current-logs/
          cp rspace/src/replay_rspace.rs n564-current-logs/corrected-replay.rs
          git fetch --no-tags --depth=1 https://github.com/rhovision-org/rholo.git 87583050ceb1d908516e67bdbfffb16defa72e2e
          git diff 87583050ceb1d908516e67bdbfffb16defa72e2e HEAD -- rspace/src/replay_rspace.rs > n564-current-logs/correction.patch
          test -s n564-current-logs/correction.patch
          git fetch --no-tags --depth=1 https://github.com/aixaria0/rchain-rust.git e8ccf9dfae4274d1aae101abeb2078b0dc318078
          git archive e8ccf9dfae4274d1aae101abeb2078b0dc318078 spec/audit/evidence/n564-rcb-recovered-20261111 spec/audit/evidence/n564-rcb-modes-20261111 | tar -x -C n564-current-logs
          git checkout --detach 87583050ceb1d908516e67bdbfffb16defa72e2e
          test "$(git rev-parse HEAD)" = 87583050ceb1d908516e67bdbfffb16defa72e2e
          git rev-parse HEAD > n564-current-logs/current-base.txt
          cp n564-current-logs/replay_trace_order.rs casper/tests/replay_trace_order.rs
          cp n564-current-logs/spec/audit/evidence/n564-rcb-recovered-20261111/omega_rcb_recovered.rs casper/tests/omega_rcb_recovered.rs
          cp n564-current-logs/spec/audit/evidence/n564-rcb-modes-20261111/omega_rcb_modes.rs casper/tests/omega_rcb_modes.rs
          mkdir -p casper/tests/rcb_recovered
          (cd n564-current-logs/spec/audit/evidence/n564-rcb-recovered-20261111/deploys && sha256sum -c SHA256SUMS)
          cp n564-current-logs/spec/audit/evidence/n564-rcb-recovered-20261111/deploys/*.bin casper/tests/rcb_recovered/
          gzip -dc n564-current-logs/spec/audit/evidence/n564-rcb-recovered-20261111/deploys/historical-state.bin.gz > casper/tests/rcb_recovered/historical-state.bin
      - name: Pinned compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Checksum-pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 60 https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip -o /tmp/protoc.zip
          python3 - <<'PY'
          import pathlib,hashlib,zipfile,os
          p=pathlib.Path('/tmp/protoc.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8"
          with zipfile.ZipFile(p) as z: z.extractall('/tmp/omega-protoc')
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("PROTOC=/tmp/omega-protoc/bin/protoc\nPROTOC_INCLUDE=/tmp/omega-protoc/include\n")
          PY
          chmod +x /tmp/omega-protoc/bin/protoc
      - name: M29 current-source failing regression and historical reproduction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo +1.95.0 test --locked -p rchain-casper --test replay_trace_order -- --nocapture --test-threads=1 > n564-current-logs/M29-regression-before.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q 'REPLAY_ORDER_FAILURE pending=4: ReplayCostMismatch' n564-current-logs/M29-regression-before.log
          cargo +1.95.0 test --locked -p rchain-casper --test omega_rcb_recovered omega_m25 -- --nocapture --test-threads=1 2>&1 | tee n564-current-logs/M29-historical-before.log
      - name: M30 exact correction, passing regression, historical replay and strict controls
        shell: bash
        run: |
          set -euo pipefail
          git apply n564-current-logs/correction.patch
          cmp rspace/src/replay_rspace.rs n564-current-logs/corrected-replay.rs
          cargo +1.95.0 test --locked -p rchain-casper --test replay_trace_order -- --nocapture --test-threads=1 2>&1 | tee n564-current-logs/M30-regression-after.log
          cargo +1.95.0 test --locked -p rchain-casper --test omega_rcb_recovered omega_m27 -- --nocapture --test-threads=1 2>&1 | tee n564-current-logs/M30-historical-after.log
          cargo +1.95.0 test --locked -p rchain-casper --test omega_rcb_modes omega_m21 -- --nocapture --test-threads=1 2>&1 | tee n564-current-logs/M30-strict-controls.log
          grep -q 'mutation=remove-comm.*REJECT ReplayCostMismatch' n564-current-logs/M30-strict-controls.log
          grep -q 'shape=failed-comm mutation=remove-comm.*REJECT ReplayStatusMismatch' n564-current-logs/M30-strict-controls.log
          cargo +1.95.0 test --locked -p rchain-rspace 2>&1 | tee n564-current-logs/M30-rspace-suite.log
          python3 tools/check-cost-register.py 2>&1 | tee n564-current-logs/M30-cost-register.log
          git diff --exit-code -- casper/src rholang/src models/src crypto/src
          test "$(git diff --name-only)" = rspace/src/replay_rspace.rs
          (cd n564-current-logs && sha256sum *.log *.txt correction.patch corrected-replay.rs replay_trace_order.rs > SHA256SUMS)
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n564-current-source-red-green
          path: n564-current-logs/
          retention-days: 30
